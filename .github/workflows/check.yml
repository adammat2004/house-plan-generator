name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Builds, then runs the browser workflows. playwright.config.ts starts the
      # server with empty AI keys, so CI never makes paid Claude or Gemini calls.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Pixel baselines, compared in the same Playwright image that took them
  # (npm run test:screens:update), so fonts and rendering match exactly.
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Keep the tag in step with @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_DOCKER: "1"
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:screens
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screens-results
          path: test-results/
          retention-days: 7
